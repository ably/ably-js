name: Lint
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          submodules: 'recursive'
          persist-credentials: false
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Use Node.js 20.x
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: 20.x
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit packages/core/ably.d.ts packages/core/modular.d.ts
      # The bundles are built by esbuild, and the React Native bundle by webpack with
      # `transpileOnly`, neither of which type checks, so the implementation is checked here.
      - run: npx tsc --noEmit -p packages/core-impl/tsconfig.json
      # The core's runtime and its declaration files. `npm ci` above has run `prepare`, which
      # builds the runtime declarations the root index.d.ts re-exports.
      - run: npx tsc --noEmit -p packages/core/tsconfig.json
      # The core's program no longer covers scripts/; the root tsconfig is what does.
      - run: npx tsc --noEmit -p tsconfig.json
      # The error-code union is generated from the ably-common submodule at its pinned
      # commit; fail if the committed copy has drifted from the registry.
      - run: npm run generate:errorcodes-ts
      - run: git diff --exit-code -- packages/core/src/errorcodes.ts
      # The three packages release in lockstep; fail if any version site has drifted (the
      # workspace package.json files, the exact core dependency pins, or the react-hooks agent
      # constant). scripts/release.js is the authority on the site list.
      - run: npm run check:versions
      # Type-checks the wrapper packages' sources and their hand-written declaration files
      # together, against the core resolved through the tsconfig's `paths`. The React hooks'
      # declaration files are generated rather than hand-written, so the `/react` subpath can only
      # be checked against them once they exist — and checking against the generated types is the
      # right thing to do anyway, since they are what a consumer resolves.
      - run: npm run build:react
      - run: npm run check:packages
      # Every package is built explicitly rather than relying on the root `npm ci` above having
      # run `prepare`, so that packing does not depend on a side effect of an earlier step. None
      # of the packages has a `prepare` of its own to build it.
      - run: npm run build
      # for some reason, this doesn't work in CI using `npx attw --pack .`
      - run: npm pack ./packages/core ./packages/device ./packages/server
      - run: npx attw ably-pubsub-core-$(node -e "console.log(require('./packages/core/package.json').version)").tgz --summary
      # `@ably/pubsub-device/modular` is deliberately ESM-only, so `require()` of it is expected
      # not to resolve. Checked separately with that one rule ignored, rather than left unchecked.
      - run: npx attw ably-pubsub-device-$(node -e "console.log(require('./packages/device/package.json').version)").tgz --summary --exclude-entrypoints '@ably/pubsub-device/modular'
      - run: npx attw ably-pubsub-device-$(node -e "console.log(require('./packages/device/package.json').version)").tgz --summary --entrypoints '@ably/pubsub-device/modular' --ignore-rules no-resolution
      - run: npx attw ably-pubsub-server-$(node -e "console.log(require('./packages/server/package.json').version)").tgz --summary
      - run: npm audit --production
